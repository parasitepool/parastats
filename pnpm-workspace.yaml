minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
trustLockfile: false
blockExoticSubdeps: true
enableGlobalVirtualStore: false
engineStrict: true
strictPeerDependencies: true
strictDepBuilds: true
verifyDepsBeforeRun: error

peerDependencyRules:
  allowedVersions:
    # eslint-config-next's plugins don't declare ESLint 10 support yet
    "eslint-plugin-import>eslint": "10"
    "eslint-plugin-react>eslint": "10"
    "eslint-plugin-jsx-a11y>eslint": "10"

overrides:
  axios@<1.15.2: '>=1.15.2'
  browserslist@<4.28.7: '>=4.28.7'
  esbuild@<0.28.1: '>=0.28.1'
  follow-redirects@<1.16.1: '>=1.16.1'
  js-yaml@>=4.0.0 <4.3.2: '>=4.3.2'
  nanoid@<3.3.18: '>=3.3.18 <4'
  postcss@<8.5.23: '>=8.5.23'
  sharp@<0.35.0: '>=0.35.0'
  ws@<8.20.1: '>=8.20.1'

allowBuilds:
  better-sqlite3@13.0.3: true
  esbuild@0.28.2: true
  sharp@0.35.4: true
  unrs-resolver@1.12.2: true
